name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    name: Extension (${{ matrix.os }}, Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18.x, 20.x]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Build shared packages
        run: npm run build:packages

      - name: Compile
        run: npm run compile -w verno

      - name: Test (Linux needs a display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test -w verno

      - name: Test
        if: runner.os != 'Linux'
        run: npm test -w verno

  web:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install
        run: npm ci

      - name: Build shared packages
        run: npm run build:packages

      - name: Typecheck
        run: npm run typecheck -w @verno/web

      - name: Lint
        run: npm run lint -w @verno/web

      - name: Build
        run: npm run build -w @verno/web

  package:
    name: Package VSIX
    needs: extension
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - run: npm run package:extension
      - uses: actions/upload-artifact@v4
        with:
          name: verno-extension
          path: dist/*.vsix
